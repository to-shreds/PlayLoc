plugins {
    id 'com.android.application'
}

def courtFlowKeystorePath = System.getenv('COURTFLOW_ANDROID_KEYSTORE_PATH')
if (!courtFlowKeystorePath || !file(courtFlowKeystorePath).isFile()) {
    throw new GradleException('Set COURTFLOW_ANDROID_KEYSTORE_PATH to the preserved CourtFlow signing keystore.')
}

android {
    namespace 'com.toshreds.courtflow'
    compileSdk 35

    defaultConfig {
        applicationId 'com.toshreds.courtflow'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '0.2.0'
    }

    signingConfigs {
        debug {
            storeFile file(courtFlowKeystorePath)
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}
