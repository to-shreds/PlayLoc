name: Expose court lookup diagnostics
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/expose-court-diagnostics.yml
      - scripts/expose_court_diagnostics.py
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply diagnostic patch
        run: python scripts/expose_court_diagnostics.py
      - name: Verify
        run: |
          python -m py_compile playlocal_server.py
          node --check <(python - <<'PY'
          import re
          from pathlib import Path
          s=Path('index.html').read_text()
          m=re.search(r'<script>(.*)</script>',s,re.S)
          print(m.group(1) if m else '')
          PY
          )
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html playlocal_server.py
          git commit -m "Expose PlayLocal court lookup diagnostics"
          git push
