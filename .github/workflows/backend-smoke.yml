name: Backend upstream smoke

on:
  workflow_dispatch:
  push:
    paths:
      - playlocal_server.py
      - .github/workflows/backend-smoke.yml

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Test PlayLocal upstream from Render
        shell: bash
        run: |
          set +e
          body=$(curl --silent --show-error --write-out '\nHTTP_STATUS:%{http_code}\n' https://courtflow-playlocal.onrender.com/upstream)
          code=$?
          echo "$body"
          exit $code
