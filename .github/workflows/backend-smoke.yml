name: Backend upstream smoke

on:
  workflow_dispatch:
  push:
    paths:
      - playlocal_server.py
      - .github/workflows/backend-smoke.yml

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Compare direct PlayLocal and Render reachability
        shell: bash
        run: |
          set +e
          echo 'DIRECT_PLAYLOCAL'
          curl --silent --show-error --location --output /tmp/playlocal.html --write-out 'HTTP_STATUS:%{http_code}\n' https://www.playlocal.com/facilities
          head -c 160 /tmp/playlocal.html | tr '\n' ' '; echo
          echo 'RENDER_UPSTREAM'
          curl --silent --show-error --write-out '\nHTTP_STATUS:%{http_code}\n' https://courtflow-playlocal.onrender.com/upstream
