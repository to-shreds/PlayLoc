name: Backend upstream smoke

on:
  workflow_dispatch:
  push:
    paths:
      - playlocal_server.py
      - .github/workflows/backend-smoke.yml

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Verify Render can reach PlayLocal
        shell: bash
        run: |
          set -e
          body=$(curl --fail --silent --show-error https://courtflow-playlocal.onrender.com/upstream)
          echo "$body"
          python -c 'import json,sys; d=json.load(sys.stdin); assert d.get("ok") is True and d.get("status")==200' <<< "$body"
