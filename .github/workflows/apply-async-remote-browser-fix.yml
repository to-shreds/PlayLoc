name: Apply async remote browser fix

on:
  push:
    paths:
      - 'scripts/async_remote_browser_fix.py'
      - '.github/workflows/apply-async-remote-browser-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python scripts/async_remote_browser_fix.py
      - name: Verify source
        run: |
          node --check browser_service/server.js
          python - <<'PY'
          from pathlib import Path
          import re
          h=Path('index.html').read_text()
          m=re.search(r'<script>(.*)</script>',h,re.S)
          if not m:
              raise SystemExit('frontend script not found')
          Path('/tmp/courtflow.js').write_text(m.group(1))
          s=Path('browser_service/server.js').read_text()
          assert 'frameReady' in s
          assert 'initializeSession' in s
          assert 'Opening PlayLocal verification now' in h
          PY
          node --check /tmp/courtflow.js
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add browser_service/server.js index.html
          git commit -m "Make remote verification startup asynchronous"
          git push
