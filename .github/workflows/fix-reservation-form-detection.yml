name: Fix reservation form detection
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/fix_reservation_form_detection.py
      - .github/workflows/fix-reservation-form-detection.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python scripts/fix_reservation_form_detection.py
      - name: Verify
        run: python -m py_compile playlocal_server.py
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add playlocal_server.py
          git commit -m "Improve PlayLocal reservation form detection"
          git push
