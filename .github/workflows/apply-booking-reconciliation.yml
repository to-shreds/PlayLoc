name: Apply booking reconciliation repair
on:
  push:
    paths:
      - .github/workflows/apply-booking-reconciliation.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: pip install -r requirements.txt >/dev/null
      - name: Apply repair
        run: python scripts/apply_booking_reconciliation.py
      - name: Verify backend and frontend
        run: |
          python -m py_compile playlocal_server.py
          python - <<'PY'
          from bs4 import BeautifulSoup
          from pathlib import Path
          import re
          import playlocal_server as p

          d=BeautifulSoup('<form><input name="cf-turnstile-response" value=""></form><div>Please wait for verification to complete</div>','html.parser')
          assert p._verification_gate(d,d.form)
          row={'date':'2026-09-20','start':'10:00 AM','title':'West Roxbury High School','text':'Court 2'}
          slot={'date':'2026-09-20','start':600,'courtName':'Court 2'}
          assert p._reservation_row_matches_slot(row,slot)
          row2=dict(row); row2['text']='Court 1'
          assert not p._reservation_row_matches_slot(row2,slot)
          h=Path('index.html').read_text()
          assert 'bookingHelp' in h
          assert "e.code=b?.error?.code" in h
          assert "VERIFICATION_REQUIRED" in h
          m=re.search(r'<script>(.*)</script>',h,re.S)
          Path('/tmp/courtflow.js').write_text(m.group(1))
          PY
          node --check /tmp/courtflow.js
      - name: Commit repair
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add playlocal_server.py index.html
          git commit -m "Reconcile PlayLocal bookings and detect verification gate"
          git push
