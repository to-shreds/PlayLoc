name: Enable Render account vault

on:
  push:
    paths:
      - 'scripts/enable_render_vault.py'
      - '.github/workflows/enable-render-vault.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply server vault patch
        run: python scripts/enable_render_vault.py
      - name: Verify Python and frontend JavaScript
        run: |
          python -m py_compile playlocal_server.py
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('playlocal_server.py').read_text()
          h=Path('index.html').read_text()
          assert 'configured_server_accounts' in s
          assert 'site_login' in s
          assert 'COURTFLOW_SITE_PASSWORD' in s
          assert "PLAYLOCAL_ACCOUNT_{i}_USERNAME" in s
          assert 'siteGate' in h
          assert 'Server-managed PlayLocal accounts loaded.' in h
          m=re.search(r'<script>(.*)</script>',h,re.S)
          Path('/tmp/courtflow.js').write_text(m.group(1))
          PY
          node --check /tmp/courtflow.js
      - name: Commit vault support
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add playlocal_server.py index.html
          git commit -m "Store PlayLocal accounts server-side behind site password"
          git push
