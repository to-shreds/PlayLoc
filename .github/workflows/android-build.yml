name: Build CourtFlow Android

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android-build.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: courtflow-android-main
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # Never run source-rewriting patch scripts during APK builds.
      - name: Check native reservation JavaScript
        run: node --check android/app/src/main/assets/reservation.js

      - name: Restore dedicated APK signing identity
        id: signing-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.courtflow-signing/courtflow-debug.keystore
          key: courtflow-android-signing-v3

      - name: Restore previous CourtFlow key for one-time signing-path migration
        if: steps.signing-cache.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v4
        with:
          path: ~/.android/debug.keystore
          key: courtflow-android-signing-v2

      - name: Prepare stable APK signing identity
        env:
          COURTFLOW_ANDROID_KEYSTORE_BASE64: ${{ secrets.COURTFLOW_ANDROID_KEYSTORE_BASE64 }}
        run: |
          mkdir -p "$HOME/.courtflow-signing"
          courtflow_keystore_path="$HOME/.courtflow-signing/courtflow-debug.keystore"
          if [ -n "$COURTFLOW_ANDROID_KEYSTORE_BASE64" ]; then
            printf '%s' "$COURTFLOW_ANDROID_KEYSTORE_BASE64" | base64 --decode > "$courtflow_keystore_path"
          elif [ ! -f "$courtflow_keystore_path" ] && [ -f "$HOME/.android/debug.keystore" ]; then
            cp "$HOME/.android/debug.keystore" "$courtflow_keystore_path"
          elif [ ! -f "$courtflow_keystore_path" ]; then
            if [ -f downloads/CourtFlow-build.json ] && python -c "import json; assert json.load(open('downloads/CourtFlow-build.json'))['versionCode'] >= 2"; then
              echo 'The saved signing key is unavailable. Restore COURTFLOW_ANDROID_KEYSTORE_BASE64 instead of changing the installed app signature.'
              exit 1
            fi
            keytool -genkeypair -keystore "$courtflow_keystore_path" -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname 'CN=CourtFlow Android Development,O=CourtFlow,C=US'
          fi
          chmod 600 "$courtflow_keystore_path"
          echo "COURTFLOW_ANDROID_KEYSTORE_PATH=$courtflow_keystore_path" >> "$GITHUB_ENV"

      - name: Preserve initial signing identity for subsequent builds
        if: steps.signing-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.courtflow-signing/courtflow-debug.keystore
          key: courtflow-android-signing-v3

      - name: Build installable APK
        run: gradle -p android :app:assembleDebug --stacktrace

      - name: Verify APK uses the preserved signing certificate
        run: |
          gradle -p android :app:signingReport
          keytool -exportcert -keystore "$COURTFLOW_ANDROID_KEYSTORE_PATH" -storepass android -alias androiddebugkey -file /tmp/courtflow-signing-cert.der
          courtflow_apksigner=$(python -c "import glob,os; print(sorted(glob.glob(os.environ['ANDROID_HOME'] + '/build-tools/*/apksigner'))[-1])")
          "$courtflow_apksigner" sign --ks "$COURTFLOW_ANDROID_KEYSTORE_PATH" --ks-key-alias androiddebugkey --ks-pass pass:android --key-pass pass:android android/app/build/outputs/apk/debug/app-debug.apk
          "$courtflow_apksigner" verify --print-certs android/app/build/outputs/apk/debug/app-debug.apk > /tmp/courtflow-apk-certs.txt
          python - <<'PY'
          import hashlib, json, os, re
          from pathlib import Path
          expected = hashlib.sha256(Path('/tmp/courtflow-signing-cert.der').read_bytes()).hexdigest()
          certificate_output = Path('/tmp/courtflow-apk-certs.txt').read_text()
          print('APK public certificate report:\n' + certificate_output, flush=True)
          reported = [match.group(1).lower() for line in certificate_output.splitlines() if (match := re.fullmatch(r'(?:Signer #\d+|V[23](?:\.\d+)? Signer:) certificate SHA-256 digest: ([0-9a-fA-F]{64})', line.strip()))]
          print('Preserved keystore certificate SHA-256: ' + expected, flush=True)
          print('Parsed APK certificate SHA-256: ' + json.dumps(reported), flush=True)
          assert reported and set(reported) == {expected}, 'APK signer differs from the preserved CourtFlow keystore'
          prior_path = Path('downloads/CourtFlow-build.json')
          prior = json.loads(prior_path.read_text()) if prior_path.exists() else {}
          assert not prior.get('signerCertificateSha256') or prior['signerCertificateSha256'] == expected, 'APK signing identity changed from the published app'
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write('COURTFLOW_ANDROID_KEYSTORE_CERT_SHA256=' + expected + '\n')
              output.write('COURTFLOW_ANDROID_SIGNER_SHA256=' + reported[0].lower() + '\n')
          print('Verified APK signer SHA-256: ' + expected)
          PY

      - name: Prepare APK download and source metadata
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          mkdir -p /tmp/courtflow-downloads
          cp android/app/build/outputs/apk/debug/app-debug.apk /tmp/courtflow-downloads/CourtFlow-debug.apk
          cd /tmp/courtflow-downloads
          sha256sum CourtFlow-debug.apk > CourtFlow-debug.sha256
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          Path('CourtFlow-build.json').write_text(json.dumps({'versionCode': 2, 'versionName': '0.2.0', 'sourceCommit': os.environ['SOURCE_COMMIT'], 'builtAt': datetime.now(timezone.utc).isoformat(), 'nativeApiVersion': 2, 'signerCertificateSha256': os.environ['COURTFLOW_ANDROID_SIGNER_SHA256'], 'keystoreCertificateSha256': os.environ['COURTFLOW_ANDROID_KEYSTORE_CERT_SHA256']}, indent=2) + '\n')
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: CourtFlow-debug-apk
          path: /tmp/courtflow-downloads/*

      - name: Publish only APK downloads to latest main
        run: |
          git fetch origin main
          git checkout -B courtflow-apk-publish origin/main
          mkdir -p downloads
          cp /tmp/courtflow-downloads/* downloads/
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add downloads/CourtFlow-debug.apk downloads/CourtFlow-debug.sha256 downloads/CourtFlow-build.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Publish CourtFlow Android 0.2 automatic session APK'
          git pull --rebase origin main
          git push origin HEAD:main
