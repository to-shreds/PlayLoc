name: Build CourtFlow Android

on:
  push:
    paths:
      - 'android/**'
      - 'scripts/apply_android_native_bridge.py'
      - 'scripts/apply_android_webview_compat.py'
      - '.github/workflows/android-build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Wire hosted frontend to native booking bridge
        run: python scripts/apply_android_native_bridge.py

      - name: Allow PlayLocal verification subframes
        run: python scripts/apply_android_webview_compat.py

      - name: Check hosted frontend JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          h=Path('index.html').read_text()
          assert 'CourtFlowNative.startBooking' in h
          assert 'courtflow-native-booking-complete' in h
          m=re.search(r'<script>(.*)</script>',h,re.S)
          Path('/tmp/courtflow.js').write_text(m.group(1))
          java=Path('android/app/src/main/java/com/toshreds/courtflow/MainActivity.java').read_text()
          assert 'if (!request.isForMainFrame()) return false;' in java
          PY
          node --check /tmp/courtflow.js

      - name: Build installable debug APK
        run: gradle -p android :app:assembleDebug --stacktrace

      - name: Publish APK into GitHub Pages tree
        run: |
          mkdir -p downloads
          cp android/app/build/outputs/apk/debug/app-debug.apk downloads/CourtFlow-debug.apk
          sha256sum downloads/CourtFlow-debug.apk | tee downloads/CourtFlow-debug.sha256

      - name: Commit frontend bridge and APK
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html android/app/src/main/java/com/toshreds/courtflow/MainActivity.java downloads/CourtFlow-debug.apk downloads/CourtFlow-debug.sha256
          git commit -m "Harden Android PlayLocal booking WebView"
          git push

      - uses: actions/upload-artifact@v4
        with:
          name: CourtFlow-debug-apk
          path: downloads/CourtFlow-debug.apk
