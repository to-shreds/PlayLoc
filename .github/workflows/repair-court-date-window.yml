name: Repair court date-window handling
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/repair-court-date-window.yml
      - scripts/repair_date_window.py
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply repair
        run: python scripts/repair_date_window.py
      - name: Verify
        run: |
          python -m py_compile playlocal_server.py
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('playlocal_server.py').read_text()
          assert 'selectedDateAccessible' in s
          assert 'timedelta(days=offset)' in s
          h=Path('index.html').read_text()
          assert 'courtNotice' in h
          m=re.search(r'<script>(.*)</script>',h,re.S)
          assert m
          Path('/tmp/courtflow.js').write_text(m.group(1))
          PY
          node --check /tmp/courtflow.js
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add playlocal_server.py index.html
          git commit -m "Handle PlayLocal reservation date windows and court lookup"
          git push
