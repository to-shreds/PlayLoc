name: Add specific court selection
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/add_specific_courts.py
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python scripts/add_specific_courts.py
      - name: Verify
        run: |
          python -m py_compile playlocal_server.py
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text()
          m=re.search(r'<script>(.*)</script>',s,re.S)
          assert m
          Path('/tmp/courtflow.js').write_text(m.group(1))
          assert 'court_options' in s
          assert 'Choose a specific court' in s
          assert 'COURT_UNAVAILABLE' in Path('playlocal_server.py').read_text()
          PY
          node --check /tmp/courtflow.js
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add playlocal_server.py index.html
          git commit -m "Use real PlayLocal court choices and require exact court"
          git push
