name: Apply browser handoff resume
on:
  push:
    paths:
      - .github/workflows/apply-browser-handoff-resume.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: pip install -r requirements.txt >/dev/null
      - name: Apply repair
        run: python scripts/apply_browser_handoff_resume.py
      - name: Verify backend and frontend
        run: |
          python -m py_compile playlocal_server.py
          python - <<'PY'
          from pathlib import Path
          import re
          import playlocal_server as p
          assert hasattr(p, 'verify_booking')
          h=Path('index.html').read_text()
          assert 'function checkPendingBooking(' in h
          assert "rpc('verify_booking'" in h
          assert 'window.addEventListener(\'focus\'' in h
          assert 'All planned reservations are confirmed.' in h
          m=re.search(r'<script>(.*)</script>',h,re.S)
          Path('/tmp/courtflow.js').write_text(m.group(1))
          PY
          node --check /tmp/courtflow.js
      - name: Commit repair
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add playlocal_server.py index.html
          git commit -m "Resume plan after PlayLocal browser verification"
          git push
