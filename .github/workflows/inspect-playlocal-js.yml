name: Inspect PlayLocal reservation client flow
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/inspect-playlocal-js.yml
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install -r requirements.txt >/dev/null
      - name: Inspect exact Reserve click handler
        shell: python
        run: |
          import os,sys
          sys.path.insert(0,os.getcwd())
          from playlocal_server import browser_session,browser_get,soup,BASE
          s=browser_session(); browser_get(s,BASE+'/',retry_403=False)
          r=browser_get(s,BASE+'/facilities',params={
            'search[date]':'2026-09-25','search[location]':'West Roxbury, MA',
            'search[reservable_type]':'TennisCourt','search[sport]':'tennis',
            'search[time]':'early_morning','commit':'Search Courts'
          },referer=BASE+'/facilities',retry_403=False)
          d=soup(r.text)
          print('PAGE',r.url)
          for i,sc in enumerate(d.find_all('script')):
            txt=sc.string or sc.get_text() or ''
            if 'reservation-selector' in txt or 'li.reserve a' in txt or 'slot-available' in txt:
              print('\nSCRIPT',i,'START')
              print(txt)
              print('SCRIPT',i,'END')
